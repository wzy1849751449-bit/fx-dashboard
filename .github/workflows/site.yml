name: 抓取汇率并发布

on:
  schedule:
    # 主跑：05:20 UTC = 08:20 东非时间(EAT)，周一至周五
    - cron: "20 5 * * 1-5"
    # 补跑：08:00 UTC = 11:00 EAT。早上某个源还没发布时，这一趟把空缺补上。
    # 脚本是幂等的，已有的非空值不会被覆盖。
    - cron: "0 8 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    name: 抓取并提交数据
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 每次触发都抓（含 push）。不怕死循环：GitHub 规定用 GITHUB_TOKEN
      # 推的提交不会再触发 workflow，机器人自己那条 commit 到此为止。
      # 这样你在网页上改任何文件，顺带就把数据刷新到最新。
      - name: 抓取 BOT / CRDB / XE
        run: node scripts/fetch-rates.mjs

      - name: 提交变更
        run: |
          git config user.name  "fx-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交。"
          else
            git commit -m "chore: 更新汇率数据 $(TZ=Africa/Nairobi date +%F)"
            git push
          fi

  deploy:
    name: 发布到 GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - id: deployment
        uses: actions/deploy-pages@v4
